# One-shot Job: pre-creates the event topics with 3 partitions each instead of
# relying on Kafka's auto-create (which defaults to 1 partition — fine for a
# single consumer, but partitions are the actual unit of parallelism in
# Kafka. With 1 partition, adding more consumer instances to the same group
# does nothing; they just sit idle since only one consumer can ever own a
# given partition at a time. 3 partitions means up to 3 consumer instances in
# the same group can genuinely process this topic in parallel.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: drishti
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka...; sleep 2; done"]
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command:
            - sh
            - -c
            - |
              set -e
              for topic in drishti.complaints drishti.recommendations; do
                /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 1 \
                  --bootstrap-server kafka:9092
              done
              /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092
