apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: drishti
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: drishti
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: qdrant-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: drishti
spec:
  selector: { app: qdrant }
  ports:
    - { port: 6333, targetPort: 6333 }
