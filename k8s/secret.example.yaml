# Copy this to secret.yaml (gitignored) and fill in the two real values below.
# Everything else already matches the in-cluster services defined in this
# directory — this stack has no dependency on your live EC2/Vercel deployment
# or its credentials.
apiVersion: v1
kind: Secret
metadata:
  name: drishti-secrets
  namespace: drishti
stringData:
  DATABASE_URL: "postgresql://drishti_user:drishti_pass@postgres:5432/drishti?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: ""
  KAFKA_BROKERS: "kafka:9092"
  EMBED_DIM: "384"
  EMBED_MODEL: "Xenova/all-MiniLM-L6-v2"
  # Free key from https://console.groq.com — required, classification won't run without it.
  GROQ_API_KEY: "REPLACE_WITH_YOUR_FREE_GROQ_KEY"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GEMINI_API_KEY: ""
  # Generate with: openssl rand -base64 48
  JWT_SECRET: "REPLACE_WITH_A_GENERATED_SECRET"
  FRONTEND_URL: "http://localhost:3000"
